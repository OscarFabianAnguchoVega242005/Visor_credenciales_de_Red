<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Credenciales de Red</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --text-color: #f1f5f9;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-blue);
        }

        .btn-refresh {
            background-color: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            background-color: var(--accent-blue);
            color: var(--bg-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #1e293b;
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .ssid-name {
            font-weight: 600;
            color: #ffffff;
        }

        .password-value {
            font-family: 'Cascadia Code', 'Courier New', monospace;
            color: var(--accent-green);
            background-color: rgba(74, 222, 128, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .no-password {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>KeyViewer - Redes Guardadas</h1>
        <a href="/" class="btn-refresh">Actualizar Lista</a>
    </header>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Nombre de Red (SSID)</th>
                    <th>Contraseña Almacenada</th>
                </tr>
            </thead>
            <tbody>
                {% for red in lista_redes %}
                <tr>
                    <td class="ssid-name">{{ red.ssid }}</td>
                    <td>
                        {% if red.password and red.password != "No encontrada" %}
                            <span class="password-value">{{ red.password }}</span>
                        {% else %}
                            <span class="no-password">Red abierta / No disponible</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
